# Render Blueprint bootstrap contract for Stage 20.
#
# The backend and migrator use this bootstrap-only tag for initial resource
# creation. The release workflow creates the tag once and never moves it.
# Production promotion must always use the exact digest returned by GHCR.
previews:
  generation: off

databases:
  - name: roa-production-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []
    connectionPool: none
    storageAutoscalingEnabled: false

services:
  - type: web
    name: roa-production-frontend
    runtime: docker
    repo: https://github.com/kamilSarbian/Restaurant_Ordering_Analytics
    branch: main
    region: frankfurt
    plan: starter
    numInstances: 1
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    autoDeployTrigger: off
    healthCheckPath: /healthz
    envVars:
      - key: BACKEND_UPSTREAM
        fromService:
          type: pserv
          name: roa-production-backend
          property: hostport

  - type: pserv
    name: roa-production-backend
    runtime: image
    region: frankfurt
    plan: starter
    numInstances: 1
    image:
      # Prebuilt-image releases are promoted by exact digest through the
      # release controller; Render's Git auto-deploy setting is not applicable.
      url: ghcr.io/kamilsarbian/restaurant-ordering-analytics-backend:stage20-bootstrap
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: TRUSTED_PROXY_MODE
        value: direct
      - key: AUTH_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: STRIPE_EXPECTED_LIVEMODE
        value: "false"
      - key: EXPECTED_ALEMBIC_HEAD
        value: 0008_add_order_ownership
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_APP_ORIGIN
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      - key: RELEASE_SHA
        sync: false

  - type: cron
    name: roa-production-migrator
    runtime: image
    region: frankfurt
    plan: starter
    schedule: "0 0 1 1 *"
    dockerCommand: /bin/sh -c 'exit 0'
    image:
      # The scheduled no-op and future one-off migration share the explicitly
      # promoted backend digest; mutable-tag auto-deploy is never the authority.
      url: ghcr.io/kamilsarbian/restaurant-ordering-analytics-backend:stage20-bootstrap
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: EXPECTED_ALEMBIC_HEAD
        value: 0008_add_order_ownership
      - key: MIGRATION_EXPECTED_LOGIN_ROLE
        value: roa_migrator
      - key: MIGRATION_OWNER_ROLE
        value: roa_owner
      - key: MIGRATION_DATABASE_URL
        sync: false
