name: Migrate Neon production database

on:
  workflow_dispatch:
    inputs:
      migration_sha:
        description: Full lowercase SHA of the current remote main commit
        required: true
        type: string
      confirmation:
        description: Type MIGRATE_NEON_PRODUCTION to authorize the migration
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: production-neon-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate Neon production database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-neon

    steps:
      - name: Validate request against remote main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_SHA: ${{ inputs.migration_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "kamilSarbian/Restaurant_Ordering_Analytics" ]]; then
            echo "Migration repository rejected." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Migration workflow must be dispatched from main." >&2
            exit 1
          fi
          if [[ "${CONFIRMATION}" != "MIGRATE_NEON_PRODUCTION" ]]; then
            echo "Migration confirmation rejected." >&2
            exit 1
          fi
          if [[ ! "${MIGRATION_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Migration SHA rejected." >&2
            exit 1
          fi

          remote_main_sha="$(
            gh api \
              --method GET \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [[ ! "${remote_main_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Remote main identity rejected." >&2
            exit 1
          fi
          if [[ "${remote_main_sha}" != "${MIGRATION_SHA}" ]]; then
            echo "Migration SHA is not the current remote main SHA." >&2
            exit 1
          fi

      - name: Check out the immutable migration commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.migration_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out source and environment boundary
        shell: bash
        env:
          MIGRATION_SHA: ${{ inputs.migration_sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${MIGRATION_SHA}" ]]; then
            echo "Checked-out migration source rejected." >&2
            exit 1
          fi
          test ! -e .env
          test ! -e backend/.env

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          check-latest: false
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install hash-locked runtime dependencies
        shell: bash
        run: |
          python -m pip install --isolated --only-binary=:all: --require-hashes -r backend/requirements.lock
          python -m pip check

      - name: Validate checked-in free-tier repository contract
        shell: bash
        run: python .github/scripts/free_tier_contract.py

      - name: Download required check-run evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_SHA: ${{ inputs.migration_sha }}
        run: |
          set -euo pipefail
          required_checks=("Backend" "Migrations" "Frontend" "Browser E2E")
          for index in "${!required_checks[@]}"; do
            check_name="${required_checks[$index]}"
            gh api \
              --method GET \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/commits/${MIGRATION_SHA}/check-runs" \
              --field "check_name=${check_name}" \
              --field "filter=latest" \
              --field "per_page=100" \
              > "${RUNNER_TEMP}/required-check-${index}.json"
          done

      - name: Require successful checks for the exact SHA
        shell: bash
        env:
          MIGRATION_SHA: ${{ inputs.migration_sha }}
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          import sys
          from pathlib import Path

          helper_path = Path(".github/scripts/free_tier_contract.py")
          spec = importlib.util.spec_from_file_location("free_tier_contract", helper_path)
          if spec is None or spec.loader is None:
              raise SystemExit("Free-tier contract helper import failed.")
          contract = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = contract
          spec.loader.exec_module(contract)

          payload_directory = Path(os.environ["RUNNER_TEMP"])
          try:
              payloads = {
                  check_name: json.loads(
                      (payload_directory / f"required-check-{index}.json").read_text(
                          encoding="utf-8"
                      )
                  )
                  for index, check_name in enumerate(contract.REQUIRED_CHECK_NAMES)
              }
              contract.validate_required_check_runs(
                  payloads,
                  os.environ["MIGRATION_SHA"],
              )
          except (OSError, json.JSONDecodeError, contract.FreeTierContractError):
              raise SystemExit("Required GitHub Actions check rejected.") from None
          PY

      - name: Run the exact Neon migration
        shell: bash
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_SHA: ${{ inputs.migration_sha }}
          APP_ENVIRONMENT: production
          MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
          EXPECTED_ALEMBIC_HEAD: 0009_add_portfolio_demo_origin_and_payment_provider
          MIGRATION_EXPECTED_LOGIN_ROLE: roa_migrator
          MIGRATION_OWNER_ROLE: roa_owner
        run: |
          set -euo pipefail
          remote_main_sha="$(
            gh api \
              --method GET \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [[ ! "${remote_main_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Remote main identity rejected." >&2
            exit 1
          fi
          if [[ "${remote_main_sha}" != "${MIGRATION_SHA}" ]]; then
            echo "Migration SHA is not the current remote main SHA." >&2
            exit 1
          fi
          exec python -m app.database.migration_runner
