map "$uri:$status" $stage17_cache_control {
    default "no-store";
    ~^/assets/.+:(?:200|206|304)$ "public, max-age=31536000, immutable";
}

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    charset utf-8;
    server_tokens off;

    resolver ${DNS_RESOLVER} ipv6=off valid=10s;
    resolver_timeout 2s;
    set $backend_origin http://${BACKEND_UPSTREAM};

    add_header Cache-Control $stage17_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: http: https:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'none'; media-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "0" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(?:docs|redoc)(?:/|$) {
        return 404;
    }

    location ~ ^/openapi\.json(?:/|$) {
        return 404;
    }

    location ~ ^/(?:api|health|ready)(?:/|$) {
        proxy_pass $backend_origin;
        proxy_http_version 1.1;
        proxy_intercept_errors off;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Proxy "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Forwarded "";

        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 2s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
