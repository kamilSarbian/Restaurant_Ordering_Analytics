[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-ordering-analytics-api"
version = "0.1.0"
description = "FastAPI backend for the Restaurant Ordering & Analytics System"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.139.2,<0.140",
    "uvicorn[standard]>=0.52.1,<0.53",
    "pydantic-settings>=2.14.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "httpx>=0.28.1,<0.29",
    "ruff>=0.15.22,<0.16",
    "black>=26.5.1,<27",
    "isort>=8.0.1,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.isort]
profile = "black"
py_version = 312
line_length = 88
skip = [".venv"]
